<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gzowo StarNet</title>
<meta name="description" content="Every Gzowo Labs project in one net. Pick what you like and the rest drops out.">
<meta name="theme-color" content="#f2eee4">
<meta property="og:title" content="Gzowo StarNet">
<meta property="og:description" content="Every Gzowo Labs project in one net. Pick what you like and the rest drops out.">
<meta property="og:image" content="https://starnet.gzowo.fun/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2eee4'/%3E%3Cpath d='M16 4 L18.6 13.4 L28 16 L18.6 18.6 L16 28 L13.4 18.6 L4 16 L13.4 13.4 Z' fill='%232b4bff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://gzowo.fun" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2eee4;--paper:#fbf8f1;--ink:#1b1a17;--soft:#6d675c;--line:#e3dccc;--acc:#2b4bff;--brass:#c99a2e;
--ui:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;--head:'Instrument Serif',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
background-image:linear-gradient(rgba(27,26,23,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(27,26,23,.055) 1px,transparent 1px);background-size:26px 26px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#stage,#labels{position:fixed;inset:0;pointer-events:none}
.node{position:absolute;left:0;top:0;width:96px;height:96px;pointer-events:auto;cursor:pointer;will-change:transform,opacity;border-radius:5px;opacity:0;box-shadow:0 8px 16px -6px rgba(27,26,23,.35)}
.node .th{width:100%;height:100%;border-radius:inherit;overflow:hidden;position:relative;border:5px solid #fff;background:#fff;box-shadow:0 2px 0 rgba(27,26,23,.18);transition:border-color .2s}
.node img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.node .th.fb{display:grid;place-items:center;font-family:var(--head);font-size:40px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 62% 50%),hsl(calc(var(--h) + 50) 62% 32%))}
.node.anchor::after{content:'';position:absolute;left:50%;top:-8px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffefb8,#c99a2e 55%,#6e4f0e);box-shadow:0 2px 3px rgba(0,0,0,.35);animation:pin .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pin{from{transform:translateY(-14px) scale(1.6);opacity:0}to{transform:none;opacity:1}}
.node.hot .th,.node:focus-visible .th{border-color:var(--acc)}
.node:focus-visible{outline:none}
.lb{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s;will-change:transform;font:600 12px/1.2 var(--ui);color:var(--ink);letter-spacing:-.01em}
.lb.on{opacity:1}
.lb b{font-weight:600;color:var(--acc);margin-left:.4em}
.lb.hot{color:var(--acc)}

#hint{position:fixed;z-index:12;left:0;top:0;transform:translate(-50%,0);padding:9px 14px;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;transition:opacity .4s,transform .4s}
#hint.off{opacity:0;transform:translate(-50%,-8px)}
#hint i{font-style:normal;color:var(--acc)}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:40;font-family:var(--head);font-style:italic;font-size:28px;transition:opacity .5s}
#loading.off{opacity:0;pointer-events:none}
#back{position:fixed;left:18px;top:16px;z-index:11;font-size:12px;font-weight:600;color:var(--soft);display:flex;align-items:center;gap:6px}
#back:hover{color:var(--ink)}

#panel{position:fixed;top:16px;right:16px;bottom:16px;width:364px;z-index:20;display:flex;flex-direction:column;background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 10px;position:relative}
.p-brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.p-logo{font-size:18px;color:var(--acc);align-self:center}
.p-title{font-family:var(--head);font-style:italic;font-size:31px;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.p-right{display:flex;align-items:center;gap:8px}
.p-count{font-size:12px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.p-count b{color:var(--ink);font-weight:700}
.p-lang{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;border:1.5px solid var(--ink)}
.p-grab{display:none}
.p-body{flex:1;overflow-y:auto;padding:0 20px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.p-sub{font-size:13px;line-height:1.45;color:var(--soft);margin-bottom:12px}
.p-sec{padding:13px 0;border-top:1px solid var(--line)}
.p-sec h3{font-size:13px;font-weight:700;letter-spacing:-.01em;margin-bottom:9px}
.p-about{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:14px 0 2px;border-top:1px solid var(--line)}
.p-about+.p-sec{border-top:0}
.hint{font-size:12.5px;line-height:1.45;color:var(--soft);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:7px 11px;border-radius:999px;border:1.5px solid var(--ink);display:inline-flex;align-items:center;gap:6px;line-height:1.1;transition:background .18s,color .18s,transform .12s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--paper)}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.like-chip{padding-left:5px}
.chip.like-chip img,.chip.like-chip .mini-fb{width:20px;height:20px;border-radius:3px;object-fit:cover}
.chip .x{opacity:.6;margin-left:2px}
.chip.nope-chip{color:var(--soft);border-style:dashed;text-decoration:line-through}
.empty{font-size:12.5px;color:var(--soft);font-style:italic}
.seg{display:flex;gap:4px;padding:3px;border-radius:999px;border:1.5px solid var(--ink)}
.seg button{flex:1;font-size:12px;padding:8px 6px;border-radius:999px;line-height:1.15;transition:background .18s,color .18s}
.seg button.on{background:var(--ink);color:var(--paper)}
.age{display:flex;align-items:center;gap:12px}
.age input{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;background:var(--ink);outline:none}
.age input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--acc);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.age input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--acc);border:2px solid var(--ink)}
.age.unset input::-webkit-slider-thumb{background:var(--paper)}
.age.unset input::-moz-range-thumb{background:var(--paper)}
.age output{min-width:44px;text-align:center;font-family:var(--head);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.mini{font-size:11px;padding:5px 9px;border-radius:999px;border:1.5px solid var(--ink);white-space:nowrap}
.age.unset .mini{background:var(--ink);color:var(--paper)}
#best{display:flex;flex-direction:column;gap:8px}
.best-row{display:flex;align-items:center;gap:10px;padding:7px;border-radius:6px;background:#fff;border:1.5px solid var(--ink);cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s}
.best-row:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
.best-row img,.best-row .mini-fb{width:46px;height:46px;border-radius:3px;object-fit:cover;flex:none}
.best-txt{flex:1;min-width:0}
.best-name{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.best-why{font-size:11.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.best-pct{font-family:var(--head);font-size:21px;font-variant-numeric:tabular-nums}
.best-play{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff;font-size:12px;border:1.5px solid var(--ink)}
.mini-fb{display:grid;place-items:center;font-family:var(--head);font-size:16px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 62% 50%),hsl(calc(var(--h) + 50) 62% 32%))}
.p-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.p-reset{font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.p-priv{font-size:11px;line-height:1.4;color:var(--soft);margin-top:10px}
.p-gone{margin-top:10px;font-size:12px;font-weight:600;color:var(--soft);text-decoration:underline;text-underline-offset:3px}
.p-gone:hover{color:var(--ink)}
.gone-list{margin-top:10px}
.gone-list .chip{border-style:dashed;color:var(--soft);font-size:12px;padding:5px 10px}

#card{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
#card[hidden]{display:none}
.c-back{position:absolute;inset:0;background:rgba(242,238,228,.72);opacity:0;transition:opacity .25s}
.c-box{position:relative;width:min(440px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;box-shadow:7px 7px 0 var(--ink);transform:translateY(18px) rotate(-1.2deg) scale(.97);opacity:0;transition:transform .34s cubic-bezier(.2,.9,.25,1.08),opacity .22s}
#card.on .c-back{opacity:1}
#card.on .c-box{transform:none;opacity:1}
.c-x{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:18px;z-index:2;display:grid;place-items:center}
.c-img{margin:10px 10px 0;aspect-ratio:4/3;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:#ddd}
.c-img img{width:100%;height:100%;object-fit:cover;display:block}
.c-img .fb{width:100%;height:100%;display:grid;place-items:center;font-family:var(--head);font-size:80px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 62% 50%),hsl(calc(var(--h) + 50) 62% 32%))}
.c-body{padding:16px 20px 20px}
.c-meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;letter-spacing:.03em;color:var(--soft);margin-bottom:4px}
.c-match{font-weight:700;color:var(--acc)}
.c-name{font-family:var(--head);font-style:italic;font-weight:400;font-size:42px;line-height:1;letter-spacing:-.01em;margin-bottom:10px}
.c-blurb{font-size:14px;line-height:1.5;margin-bottom:14px;-webkit-user-select:text;user-select:text}
.c-whyh{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin-bottom:7px}
.c-why{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.c-why span{font-size:12px;padding:5px 10px;border-radius:999px;background:#fff;border:1.5px solid var(--ink)}
.c-why.neg span{border-style:dashed;color:var(--soft)}
.c-facts{font-size:12px;color:var(--soft);margin-bottom:16px;line-height:1.5}
.c-btns{display:flex;gap:8px}
.c-btns>*{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 8px;font-size:13.5px;font-weight:700;border-radius:999px;border:1.5px solid var(--ink);background:#fff;text-align:center;line-height:1.1;transition:transform .12s}
.c-btns>*:active{transform:scale(.96)}
.c-btns .c-play{background:var(--acc);color:#fff}
.c-btns .c-like.on{background:var(--ink);color:var(--paper)}

@media (max-width:760px){
  #back{display:none}
  #panel{top:auto;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));width:auto;height:min(78vh,640px);transform:translateY(calc(100% - 152px));transition:transform .45s cubic-bezier(.2,.85,.2,1)}
  #panel.open{transform:none}
  .p-head{cursor:pointer;padding-top:20px}
  .p-title{font-size:27px}
  .p-grab{display:block;position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--ink);opacity:.25}
  .p-sub{display:none}
  .c-name{font-size:36px}
  #hint{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.node.anchor::after{animation:none}}
</style>
</head>
<body>
<canvas id="lines"></canvas>
<div id="stage" role="list"></div>
<div id="labels" aria-hidden="true"></div>
<a id="back" href="https://gzowo.fun/">← gzowo.fun</a>
<div id="hint" class="off"></div>
<div id="loading"></div>
<aside id="panel" aria-label="StarNet">
  <header class="p-head" id="phead">
    <div class="p-grab"></div>
    <div class="p-brand"><span class="p-logo">✦</span><span class="p-title">Gzowo StarNet</span></div>
    <div class="p-right"><span class="p-count" id="cnt"></span><button class="p-lang" id="lang">EN</button></div>
  </header>
  <div class="p-body">
    <p class="p-sub" data-t="sub"></p>
    <section class="p-sec"><h3 data-t="best"></h3><div id="best"></div><button class="p-gone" id="goneBtn" hidden></button><div class="chips gone-list" id="goneList" hidden></div></section>
    <section class="p-sec"><h3 data-t="likes"></h3><p class="hint" data-t="likesHint"></p><div id="likeChips" class="chips"></div></section>
    <div class="p-about" data-t="about"></div>
    <section class="p-sec"><h3 data-t="age"></h3><div class="age unset" id="ageBox"><input type="range" id="age" min="4" max="19" step="1" value="11" aria-label="age"><output id="ageOut">?</output><button class="mini" id="ageClear" data-t="ageNone"></button></div></section>
    <section class="p-sec"><h3 data-t="with"></h3><div class="seg"><button data-with="solo" data-t="solo"></button><button data-with="online" data-t="online"></button><button data-with="couch" data-t="couch"></button></div></section>
    <section class="p-sec"><h3 data-t="mood"></h3><div class="chips" id="moods"></div></section>
    <section class="p-sec"><h3 data-t="time"></h3><div class="seg"><button data-time="5" data-t="t5"></button><button data-time="30" data-t="t30"></button><button data-time="120" data-t="t120"></button></div></section>
    <section class="p-sec"><h3 data-t="kit"></h3><div class="chips"><button class="chip" data-kit="cam" data-t="cam"></button><button class="chip" data-kit="proj" data-t="proj"></button><button class="chip" data-kit="phone" data-t="phone"></button><button class="chip" data-kit="mic" data-t="mic"></button><button class="chip" data-kit="head" data-t="head"></button><button class="chip" data-kit="none" data-t="none"></button></div></section>
    <section class="p-sec"><h3 data-t="device"></h3><div class="seg"><button data-dev="desk" data-t="desk"></button><button data-dev="phone" data-t="phoneDev"></button></div></section>
    <div class="p-foot"><button class="p-reset" id="reset" data-t="reset"></button><a class="p-reset" href="https://gzowo.fun/" data-t="home"></a></div>
    <p class="p-priv" data-t="privacy"></p>
  </div>
</aside>
<div id="card" hidden>
  <div class="c-back"></div>
  <div class="c-box" role="dialog" aria-modal="true" aria-labelledby="cName">
    <button class="c-x" aria-label="close">×</button>
    <div class="c-img"></div>
    <div class="c-body">
      <div class="c-meta"><span class="c-cat"></span><span class="c-match"></span></div>
      <h2 class="c-name" id="cName"></h2>
      <p class="c-blurb"></p>
      <div class="c-whyh"></div>
      <div class="c-why"></div>
      <div class="c-facts"></div>
      <div class="c-btns"><button class="c-like"></button><button class="c-nope"></button><a class="c-play" target="_blank" rel="noopener"></a></div>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
